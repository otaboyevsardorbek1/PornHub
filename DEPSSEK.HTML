<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek AI - O'zbek tilidagi sun'iy intellekt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --accent-primary: #4a9eff;
            --accent-secondary: #6c5ce7;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --success: #00b894;
            --error: #ff7675;
            --warning: #fdcb6e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* Asosiy container */
        .app {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar.collapsed .logo-text,
        .sidebar.collapsed .new-chat-btn span,
        .sidebar.collapsed .chat-item-info,
        .sidebar.collapsed .user-info span {
            display: none;
        }

        .toggle-sidebar {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            border-radius: 5px;
        }

        .toggle-sidebar:hover {
            background: var(--bg-tertiary);
        }

        .new-chat-btn {
            margin: 20px;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .new-chat-btn:hover {
            transform: scale(1.02);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-history-item {
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-history-item:hover {
            background: var(--bg-tertiary);
        }

        .chat-history-item.active {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent-primary);
        }

        .chat-item-icon {
            width: 32px;
            height: 32px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
        }

        .chat-item-info {
            flex: 1;
        }

        .chat-item-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .chat-item-date {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .user-info {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
        }

        .user-email {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Asosiy kontent */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        /* Header */
        .main-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-title span {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .api-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .api-status.offline .status-dot {
            background: var(--error);
        }

        .header-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-primary);
        }

        /* Chat container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Xabarlar */
        .message {
            display: flex;
            gap: 15px;
            max-width: 85%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .user-message .message-avatar {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        }

        .bot-message .message-avatar {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }

        .message-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-content {
            padding: 15px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .user-message .message-content {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border-bottom-right-radius: 5px;
        }

        .bot-message .message-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 5px;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            padding: 0 10px;
        }

        .user-message .message-time {
            text-align: right;
        }

        /* Fayl prefiksi */
        .file-attachment {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid var(--border-color);
        }

        .file-icon {
            font-size: 24px;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .file-size {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .file-download {
            color: var(--accent-primary);
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
        }

        .file-download:hover {
            background: var(--bg-secondary);
        }

        /* Rasm prefiksi */
        .image-attachment {
            max-width: 300px;
            border-radius: 10px;
            margin-top: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .image-attachment:hover {
            transform: scale(1.02);
        }

        /* Kod bloklari */
        .code-block {
            background: var(--bg-tertiary);
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }

        .code-header {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .code-content {
            padding: 15px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .copy-code {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
        }

        .copy-code:hover {
            background: var(--bg-secondary);
        }

        /* Yuklanish indikatori */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px 20px;
            background: var(--bg-secondary);
            border-radius: 18px;
            width: fit-content;
            border: 1px solid var(--border-color);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: typing 1.5s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
            background: var(--accent-secondary);
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
            background: var(--success);
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* Input maydoni */
        .input-container {
            padding: 25px 30px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
        }

        .input-toolbar {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }

        .tool-btn.active {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }

        .input-area {
            display: flex;
            padding: 5px 15px;
            background: var(--bg-secondary);
        }

        .input-area textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            outline: none;
            font-family: inherit;
            max-height: 200px;
        }

        .input-area textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(74, 158, 255, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Yuklangan fayllar */
        .attached-files {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 15px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
        }

        .attached-file {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 12px;
        }

        .remove-file {
            color: var(--error);
            cursor: pointer;
            margin-left: 5px;
            font-size: 14px;
        }

        /* Modal oynalar */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            line-height: 1;
        }

        .modal-body {
            padding: 20px;
        }

        /* Sozlamalar */
        .settings-group {
            margin-bottom: 25px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .settings-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .settings-input:focus {
            border-color: var(--accent-primary);
        }

        .settings-select {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .settings-option {
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .settings-option:hover {
            border-color: var(--accent-primary);
        }

        .settings-option input[type="radio"] {
            accent-color: var(--accent-primary);
        }

        .option-info h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .option-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Yuklangan rasmlarni ko'rish */
        .image-viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 50px;
        }

        .image-viewer.active {
            display: flex;
        }

        .viewer-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .close-viewer {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                height: 100vh;
                z-index: 100;
                transition: left 0.3s;
            }

            .sidebar.active {
                left: 0;
            }

            .message {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">DS</div>
                    <span class="logo-text">DeepSeek AI</span>
                </div>
                <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>
            </div>

            <button class="new-chat-btn" onclick="newChat()">
                <span>+</span>
                <span>Yangi chat</span>
            </button>

            <div class="chat-history" id="chatHistory">
                <!-- Chat tarixi dinamik yuklanadi -->
            </div>

            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div class="user-details">
                    <div class="user-name">Foydalanuvchi</div>
                    <div class="user-email">online</div>
                </div>
            </div>
        </div>

        <!-- Asosiy kontent -->
        <div class="main-content">
            <!-- Header -->
            <div class="main-header">
                <div class="header-title">
                    <button class="toggle-sidebar mobile-only" onclick="toggleSidebar()" style="display: none;">☰</button>
                    <h2>DeepSeek AI Chat</h2>
                    <span id="currentModel">deepseek-chat</span>
                </div>
                <div class="header-actions">
                    <div class="api-status" id="apiStatus">
                        <span class="status-dot"></span>
                        <span id="statusText">API ulanmagan</span>
                    </div>
                    <button class="header-btn" onclick="openSettings()">
                        <span>⚙️</span>
                        <span>Sozlamalar</span>
                    </button>
                </div>
            </div>

            <!-- Chat maydoni -->
            <div class="chat-container" id="chatContainer"></div>

            <!-- Input maydoni -->
            <div class="input-container">
                <div class="input-wrapper">
                    <div class="input-toolbar">
                        <button class="tool-btn" onclick="document.getElementById('fileInput').click()">
                            <span>📎</span>
                            <span>Fayl</span>
                        </button>
                        <button class="tool-btn" onclick="document.getElementById('imageInput').click()">
                            <span>🖼️</span>
                            <span>Rasm</span>
                        </button>
                        <button class="tool-btn" onclick="toggleCodeMode()" id="codeModeBtn">
                            <span>{ }</span>
                            <span>Kod</span>
                        </button>
                        <button class="tool-btn" onclick="toggleSearchMode()" id="searchModeBtn">
                            <span>🔍</span>
                            <span>Qidirish</span>
                        </button>
                    </div>

                    <!-- Yuklangan fayllar -->
                    <div class="attached-files" id="attachedFiles" style="display: none;"></div>

                    <div class="input-area">
                        <textarea 
                            id="userInput" 
                            placeholder="Xabar yozing yoki fayl yuklang..." 
                            onkeypress="handleKeyPress(event)"
                            rows="1"
                        ></textarea>
                        <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                            <span>📤</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sozlamalar modali -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Sozlamalar</h3>
                <button class="close-modal" onclick="closeSettings()">×</button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <label>API sozlamalari</label>
                    <input type="text" class="settings-input" id="apiKeyInput" placeholder="DeepSeek API kaliti">
                    <button class="header-btn" style="width: 100%; margin-top: 10px;" onclick="connectAPI()">
                        Ulanish
                    </button>
                </div>

                <div class="settings-group">
                    <label>Modelni tanlang</label>
                    <select class="settings-select" id="modelSelect" onchange="changeModel(this.value)">
                        <option value="deepseek-chat">DeepSeek Chat (umumiy suhbat)</option>
                        <option value="deepseek-coder">DeepSeek Coder (dasturlash)</option>
                        <option value="deepseek-reasoner">DeepSeek Reasoner (mantiqiy fikrlash)</option>
                        <option value="deepseek-vision">DeepSeek Vision (rasm tahlili)</option>
                    </select>
                </div>

                <div class="settings-group">
                    <label>Sozlash parametrlari</label>
                    <div class="settings-option">
                        <input type="radio" name="temperature" value="0.3" id="temp1">
                        <div class="option-info">
                            <h4>Aniq 🎯</h4>
                            <p>Faktlarga asoslangan, aniq javoblar</p>
                        </div>
                    </div>
                    <div class="settings-option">
                        <input type="radio" name="temperature" value="0.7" id="temp2" checked>
                        <div class="option-info">
                            <h4>Muvozanatli ⚖️</h4>
                            <p>Aniqlik va ijodkorlik o'rtasida</p>
                        </div>
                    </div>
                    <div class="settings-option">
                        <input type="radio" name="temperature" value="1.0" id="temp3">
                        <div class="option-info">
                            <h4>Ijodiy 🎨</h4>
                            <p>Erkin va ijodiy javoblar</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Rasm ko'rish modali -->
    <div class="image-viewer" id="imageViewer" onclick="closeImageViewer()">
        <img src="" alt="Katta rasm" class="viewer-image" id="viewerImage">
        <div class="close-viewer">×</div>
    </div>

    <!-- Yuklash uchun hidden inputlar -->
    <input type="file" id="fileInput" style="display: none;" multiple onchange="handleFileUpload(this.files)">
    <input type="file" id="imageInput" style="display: none;" accept="image/*" multiple onchange="handleImageUpload(this.files)">

    <script>
        // ==================== KONSTANTALAR ====================
        const DEEPSEEK_API_URL = 'https://api.deepseek.com/v1/chat/completions';
        
        // ==================== GLOBAL O'ZGARUVCHILAR ====================
        let apiKey = localStorage.getItem('deepseek_api_key') || '';
        let isConnected = false;
        let messages = [];
        let displayedMessages = 0;
        let isLoading = false;
        let currentModel = localStorage.getItem('deepseek_model') || 'deepseek-chat';
        let temperature = 0.7;
        let codeMode = false;
        let searchMode = false;
        let attachedFiles = [];
        let chats = JSON.parse(localStorage.getItem('deepseek_chats')) || [];
        let currentChatId = localStorage.getItem('current_chat_id') || Date.now().toString();

        // ==================== BOSHLANG'ICH FUNKSIYALAR ====================
        window.onload = function() {
            initializeApp();
            loadChats();
            if (apiKey) checkAPIConnection();
            document.getElementById('modelSelect').value = currentModel;
            document.getElementById('currentModel').textContent = currentModel;
        };

        function initializeApp() {
            if (!chats.length) {
                createNewChat();
            } else {
                loadChat(currentChatId);
            }
        }

        // ==================== CHAT FUNKSIYALARI ====================
        function createNewChat() {
            const chat = {
                id: Date.now().toString(),
                title: 'Yangi chat',
                messages: [
                    {
                        role: 'assistant',
                        content: 'Assalomu alaykum! Men DeepSeek AI yordamchiman. Qanday yordam bera olaman?',
                        timestamp: new Date().toISOString()
                    }
                ],
                createdAt: new Date().toISOString()
            };
            
            chats.unshift(chat);
            currentChatId = chat.id;
            saveChats();
            loadChat(chat.id);
            renderChatHistory();
        }

        function loadChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            
            currentChatId = chatId;
            messages = chat.messages.map(m => ({
                ...m,
                timestamp: new Date(m.timestamp)
            }));
            
            displayInitialMessages();
            updateActiveChatInSidebar();
        }

        function saveCurrentChat() {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages = messages.map(m => ({
                    ...m,
                    timestamp: m.timestamp.toISOString()
                }));
                chat.title = messages[0]?.content.substring(0, 30) + '...' || 'Yangi chat';
                saveChats();
                renderChatHistory();
            }
        }

        function saveChats() {
            localStorage.setItem('deepseek_chats', JSON.stringify(chats));
            localStorage.setItem('current_chat_id', currentChatId);
        }

        function renderChatHistory() {
            const historyEl = document.getElementById('chatHistory');
            historyEl.innerHTML = '';
            
            chats.forEach(chat => {
                const date = new Date(chat.createdAt);
                const timeStr = date.toLocaleDateString('uz-UZ', { month: 'short', day: 'numeric' });
                
                const item = document.createElement('div');
                item.className = `chat-history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.onclick = () => loadChat(chat.id);
                
                item.innerHTML = `
                    <div class="chat-item-icon">💬</div>
                    <div class="chat-item-info">
                        <div class="chat-item-title">${chat.title}</div>
                        <div class="chat-item-date">${timeStr}</div>
                    </div>
                `;
                
                historyEl.appendChild(item);
            });
        }

        function updateActiveChatInSidebar() {
            const items = document.querySelectorAll('.chat-history-item');
            items.forEach(item => {
                item.classList.remove('active');
            });
            // Find and activate current chat
        }

        function newChat() {
            createNewChat();
        }

        // ==================== API FUNKSIYALARI ====================
        async function checkAPIConnection() {
            if (!apiKey) {
                updateAPIStatus('API ulanmagan', false);
                return;
            }
            
            try {
                const response = await fetch('https://api.deepseek.com/v1/models', {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });
                
                isConnected = response.ok;
                updateAPIStatus(isConnected ? 'API ulangan' : 'API xatolik', isConnected);
            } catch (error) {
                isConnected = false;
                updateAPIStatus('Ulanish xatosi', false);
            }
        }

        function updateAPIStatus(text, isActive) {
            const statusEl = document.getElementById('apiStatus');
            const statusText = document.getElementById('statusText');
            
            statusText.textContent = text;
            if (isActive) {
                statusEl.classList.remove('offline');
            } else {
                statusEl.classList.add('offline');
            }
        }

        function connectAPI() {
            const keyInput = document.getElementById('apiKeyInput');
            const newKey = keyInput.value.trim();
            
            if (newKey) {
                apiKey = newKey;
                localStorage.setItem('deepseek_api_key', newKey);
                checkAPIConnection();
                addSystemMessage('✅ API ga muvaffaqiyatli ulandi!');
                closeSettings();
            }
        }

        // ==================== XABARLARNI KO'RSATISH ====================
        function displayInitialMessages() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            
            const startIndex = Math.max(0, messages.length - 10);
            displayedMessages = messages.length - startIndex;
            
            for (let i = startIndex; i < messages.length; i++) {
                displayMessage(messages[i]);
            }
            
            container.scrollTop = container.scrollHeight;
        }

        function displayMessage(message) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.role === 'user' ? 'user-message' : 'bot-message'}`;
            
            const timeString = formatTime(message.timestamp);
            const avatar = message.role === 'user' ? '👤' : '🤖';
            
            let content = formatMessage(message.content);
            
            // Agar fayl biriktirilgan bo'lsa
            if (message.files) {
                content += renderAttachments(message.files);
            }
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content-wrapper">
                    <div class="message-content">${content}</div>
                    <div class="message-time">${timeString}</div>
                </div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function formatMessage(text) {
            if (!text) return '';
            
            // Kod bloklarini formatlash
            const codeRegex = /```(\w*)\n([\s\S]*?)```/g;
            text = text.replace(codeRegex, (match, lang, code) => {
                return `
                    <div class="code-block">
                        <div class="code-header">
                            <span>${lang || 'code'}</span>
                            <button class="copy-code" onclick="copyToClipboard(\`${code.replace(/`/g, '\\`')}\`)">Kopiya qilish</button>
                        </div>
                        <div class="code-content">${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                    </div>
                `;
            });
            
            // URL larni link qilish
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            text = text.replace(urlRegex, '<a href="$1" target="_blank" style="color: var(--accent-primary);">$1</a>');
            
            return text.replace(/\n/g, '<br>');
        }

        function renderAttachments(files) {
            let html = '';
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    html += `
                        <img src="${file.data}" class="image-attachment" onclick="openImageViewer('${file.data}')">
                    `;
                } else {
                    html += `
                        <div class="file-attachment">
                            <span class="file-icon">📄</span>
                            <div class="file-info">
                                <div class="file-name">${file.name}</div>
                                <div class="file-size">${formatFileSize(file.size)}</div>
                            </div>
                            <span class="file-download" onclick="downloadFile('${file.data}', '${file.name}')">⬇️</span>
                        </div>
                    `;
                }
            });
            return html;
        }

        function formatTime(date) {
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // ==================== XABAR YUBORISH ====================
        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            
            if (!message && attachedFiles.length === 0) return;
            
            if (!isConnected) {
                alert('Iltimos, avval API ga ulaning!');
                openSettings();
                return;
            }
            
            // Foydalanuvchi xabarini yaratish
            const userMessage = {
                role: 'user',
                content: message || 'Fayl yuklandi',
                timestamp: new Date(),
                files: attachedFiles.length ? [...attachedFiles] : null
            };
            
            messages.push(userMessage);
            displayMessage(userMessage);
            
            // Inputni tozalash
            userInput.value = '';
            attachedFiles = [];
            updateAttachedFiles();
            autoResizeTextarea();
            
            // Tugmalarni o'chirish
            setInputState(false);
            
            // Yuklanish indikatori
            showTypingIndicator();
            
            try {
                // API ga so'rov
                const response = await fetch(DEEPSEEK_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        messages: prepareMessagesForAPI(),
                        temperature: temperature,
                        max_tokens: 4000,
                        stream: false
                    })
                });
                
                hideTypingIndicator();
                
                if (response.ok) {
                    const data = await response.json();
                    const botResponse = data.choices[0].message.content;
                    
                    const botMessage = {
                        role: 'assistant',
                        content: botResponse,
                        timestamp: new Date()
                    };
                    
                    messages.push(botMessage);
                    displayMessage(botMessage);
                    saveCurrentChat();
                } else {
                    const error = await response.json();
                    showErrorMessage(`Xatolik: ${error.error?.message || 'Noma\'lum xatolik'}`);
                }
            } catch (error) {
                hideTypingIndicator();
                showErrorMessage(`Ulanish xatosi: ${error.message}`);
            }
            
            setInputState(true);
            userInput.focus();
        }

        function prepareMessagesForAPI() {
            return messages.map(m => ({
                role: m.role,
                content: m.files ? 
                    `${m.content}\n\n[Fayl: ${m.files.map(f => f.name).join(', ')}]` : 
                    m.content
            }));
        }

        // ==================== FAYL YUKLASH ====================
        async function handleFileUpload(files) {
            for (let file of files) {
                if (file.size > 10 * 1024 * 1024) {
                    alert(`${file.name} juda katta! Maksimal 10MB`);
                    continue;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedFiles.push({
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        data: e.target.result
                    });
                    updateAttachedFiles();
                };
                reader.readAsDataURL(file);
            }
        }

        async function handleImageUpload(files) {
            for (let file of files) {
                if (!file.type.startsWith('image/')) {
                    alert(`${file.name} rasm emas!`);
                    continue;
                }
                
                if (file.size > 5 * 1024 * 1024) {
                    alert(`${file.name} juda katta! Maksimal 5MB`);
                    continue;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedFiles.push({
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        data: e.target.result
                    });
                    updateAttachedFiles();
                };
                reader.readAsDataURL(file);
            }
        }

        function updateAttachedFiles() {
            const container = document.getElementById('attachedFiles');
            if (attachedFiles.length > 0) {
                container.style.display = 'flex';
                container.innerHTML = attachedFiles.map((file, index) => `
                    <div class="attached-file">
                        ${file.type.startsWith('image/') ? '🖼️' : '📄'}
                        ${file.name.substring(0, 15)}${file.name.length > 15 ? '...' : ''}
                        <span class="remove-file" onclick="removeFile(${index})">×</span>
                    </div>
                `).join('');
            } else {
                container.style.display = 'none';
            }
        }

        function removeFile(index) {
            attachedFiles.splice(index, 1);
            updateAttachedFiles();
        }

        // ==================== YORDAMCHI FUNKSIYALAR ====================
        function showTypingIndicator() {
            const container = document.getElementById('chatContainer');
            const indicator = document.createElement('div');
            indicator.className = 'message bot-message';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            container.appendChild(indicator);
            container.scrollTop = container.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function showErrorMessage(text) {
            const errorMessage = {
                role: 'assistant',
                content: `⚠️ ${text}`,
                timestamp: new Date()
            };
            messages.push(errorMessage);
            displayMessage(errorMessage);
        }

        function addSystemMessage(text) {
            const systemMessage = {
                role: 'assistant',
                content: `🔔 ${text}`,
                timestamp: new Date()
            };
            messages.push(systemMessage);
            displayMessage(systemMessage);
        }

        function setInputState(enabled) {
            const sendBtn = document.getElementById('sendBtn');
            const userInput = document.getElementById('userInput');
            sendBtn.disabled = !enabled;
            userInput.disabled = !enabled;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResizeTextarea() {
            const textarea = document.getElementById('userInput');
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        // ==================== UI FUNKSIYALARI ====================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('apiKeyInput').value = apiKey;
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function changeModel(model) {
            currentModel = model;
            localStorage.setItem('deepseek_model', model);
            document.getElementById('currentModel').textContent = model;
            
            const temperatureRadios = document.getElementsByName('temperature');
            for (let radio of temperatureRadios) {
                if (radio.checked) {
                    temperature = parseFloat(radio.value);
                    break;
                }
            }
            
            addSystemMessage(`Model o'zgartirildi: ${model}`);
        }

        function toggleCodeMode() {
            codeMode = !codeMode;
            const btn = document.getElementById('codeModeBtn');
            btn.classList.toggle('active');
            if (codeMode) {
                document.getElementById('userInput').placeholder = 'Kod yozing...';
            } else {
                document.getElementById('userInput').placeholder = 'Xabar yozing yoki fayl yuklang...';
            }
        }

        function toggleSearchMode() {
            searchMode = !searchMode;
            const btn = document.getElementById('searchModeBtn');
            btn.classList.toggle('active');
        }

        function openImageViewer(src) {
            document.getElementById('viewerImage').src = src;
            document.getElementById('imageViewer').classList.add('active');
        }

        function closeImageViewer() {
            document.getElementById('imageViewer').classList.remove('active');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Kod nusxalandi!');
            });
        }

        function downloadFile(data, filename) {
            const link = document.createElement('a');
            link.href = data;
            link.download = filename;
            link.click();
        }

        // Textarea o'lchamini o'zgartirish
        document.getElementById('userInput').addEventListener('input', autoResizeTextarea);
    </script>
</body>
</html>
